<!-- Source-built from efb.js DeparturePerformance (shown on the ground). Stepper option lists come
     from the bundle's thrustSettings / antiIceSettings tables; the runway list is invented; the
     Runway Length unit box is assumed "ft" (isMetric false). CONFIRM ON THE GROUND before merge. -->
<div class="mx-auto flex w-10/12 justify-center">
  <div class="grid w-full grid-cols-2">
    <div class="mr-8">
      <h2 class="mb-2 text-center text-base font-bold">Airport</h2>
      <div class="flex items-center justify-between rounded-t-md bg-zinc-600 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>ICAO code</span><input type="text" class="border-white w-1/2 rounded-lg border bg-zinc-700 px-3 py-2 text-left" value="KMEM"></div></div>
      <div class="flex items-center justify-between bg-zinc-700 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Runway</span><div class="flex w-1/2"><div class="w-1/2"><div class="relative"><input disabled class="w-full rounded-l-lg border border-white bg-zinc-700 px-3 py-2 text-white" value="RW18C" data-options="RW18C|RW18L|RW18R|RW36C|RW36L|RW36R"><button type="button" class="absolute right-2 top-0 border-t bg-zinc-700 text-white" disabled><svg class="lucide lucide-chevron-up"></svg></button><button type="button" class="absolute bottom-0 right-2 border-b bg-zinc-700 text-white"><svg class="lucide lucide-chevron-down"></svg></button></div></div><div class="flex w-1/2 items-center justify-center rounded-r-lg border border-white bg-zinc-600 px-2"><span class="mr-2">Slope</span><span>0.0%</span></div></div></div></div>
      <div class="flex items-center justify-between bg-zinc-600 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Runway Length</span><div class="flex w-1/2"><input type="number" placeholder="----" class="border-white w-full rounded-l-lg border bg-zinc-700 px-3 py-2 text-left" value="9000"><div class="flex items-center rounded-r-lg border border-white bg-zinc-600 px-2">ft</div></div></div></div>
      <div class="flex items-center justify-between bg-zinc-700 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Wind</span><div class="flex w-1/2"><input type="text" placeholder="---/--" class="border-white w-1/2 rounded-l-lg border bg-zinc-700 px-3 py-2 text-left" value=""><div class="text-white flex w-1/2 items-center justify-center rounded-r-lg border border-white bg-zinc-600 px-2"><span class="mr-2">Headwind</span><span>0KT</span></div></div></div></div>
      <div class="flex items-center justify-between bg-zinc-600 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Temperature</span><div class="flex w-1/2"><input type="number" placeholder="--" class="border-red-500 w-full rounded-l-lg border bg-zinc-700 px-3 py-2 text-left" value=""><div class="flex items-center rounded-r-lg border border-white bg-zinc-600 px-2">°C</div></div></div></div>
      <div class="flex items-center justify-between bg-zinc-700 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Pressure</span><div class="flex w-1/2"><input type="number" placeholder="--.--" class="border-red-500 w-3/4 rounded-l-lg border bg-zinc-700 px-3 py-2 text-left" value=""><div class="flex w-1/4 items-center justify-center rounded-r-lg border border-white bg-zinc-600 px-2">inHg</div></div></div></div>
      <button class="text-2xs w-full rounded-b-lg bg-blue-700 px-6 py-3 font-sans font-bold uppercase text-white">Get weather information</button>
      <h2 class="my-2 text-center text-base font-bold">Aircraft</h2>
      <div class="flex items-center justify-between rounded-t-md bg-zinc-600 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Takeoff Weight</span><div class="flex w-1/2"><input type="number" placeholder="-----" class="border-red-500 w-full rounded-l-lg border bg-zinc-700 px-3 py-2 text-left" value=""><div class="flex items-center rounded-r-lg border border-white bg-zinc-600 px-2">lb</div></div></div></div>
      <div class="flex items-center justify-between bg-zinc-700 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Thrust Setting</span><div class="w-1/2"><div class="relative"><input disabled class="w-full rounded-lg border border-white bg-zinc-700 px-3 py-2 text-white" value="TO" data-options="FLEX|TO|TO1|TO2"><button type="button" class="absolute right-2 top-0 border-t bg-zinc-700 text-white"><svg class="lucide lucide-chevron-up"></svg></button><button type="button" class="absolute bottom-0 right-2 border-b bg-zinc-700 text-white"><svg class="lucide lucide-chevron-down"></svg></button></div></div></div></div>
      <div class="flex items-center justify-between bg-zinc-600 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Anti-Ice</span><div class="w-1/2"><div class="relative"><input disabled class="w-full rounded-lg border border-white bg-zinc-700 px-3 py-2 text-white" value="NONE" data-options="NONE|ENG|ENG + WING"><button type="button" class="absolute right-2 top-0 border-t bg-zinc-700 text-white" disabled><svg class="lucide lucide-chevron-up"></svg></button><button type="button" class="absolute bottom-0 right-2 border-b bg-zinc-700 text-white"><svg class="lucide lucide-chevron-down"></svg></button></div></div></div></div>
      <div class="flex items-center justify-between bg-zinc-700 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Flaps</span><div class="inline-flex w-1/2 rounded-md shadow-sm" role="group"><button type="button" class="bg-green-700 w-1/2 rounded-l-lg border border-white px-4 py-2 text-white">Optimum</button><button type="button" class="bg-zinc-700 w-1/2 rounded-r-md border border-white px-4 py-2 text-white">Specific</button></div></div></div>
      <div class="flex items-center justify-between bg-zinc-600 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Specific Flaps</span><input type="number" placeholder="--" class="border-white w-1/2 rounded-lg border bg-zinc-700 px-3 py-2 text-left" value=""></div></div>
      <div class="flex items-center justify-between rounded-b-md bg-zinc-700 p-2 px-4 text-lg"><div class="flex w-full items-center justify-between text-xs"><span>Packs</span><div class="inline-flex w-1/2 rounded-md shadow-sm" role="group"><button type="button" class="bg-green-700 w-1/2 rounded-l-lg border border-white px-4 py-2 text-white">On</button><button type="button" class="bg-zinc-700 w-1/2 rounded-r-md border border-white px-4 py-2 text-white">Off</button></div></div></div>
      <button class="text-2xs w-full rounded-b-lg bg-blue-700 px-6 py-3 font-sans font-bold uppercase text-white">Get Takeoff Weight</button>
    </div>
    <div class="mb-6 ml-8 flex flex-col gap-y-4">
      <button class="text-2xs rounded-lg bg-green-700 px-6 py-3 font-sans font-bold uppercase text-white">Calculate</button>
      <div class="flex flex-row">
        <div class="flex w-full items-center justify-between rounded-bl-lg bg-zinc-600 p-2 px-4 text-lg"><div class="flex w-full flex-col items-center text-xs"><span class="mb-2">V1</span><input type="text" disabled class="w-1/2 rounded-lg border border-white bg-zinc-700 px-3 py-2 text-left" value="---"></div></div>
        <div class="flex w-full items-center justify-between bg-zinc-700 p-2 px-4 text-lg"><div class="flex w-full flex-col items-center text-xs"><span class="mb-2">VR</span><input type="text" disabled class="w-1/2 rounded-lg border border-white bg-zinc-700 px-3 py-2 text-left" value="---"></div></div>
        <div class="flex w-full items-center justify-between bg-zinc-600 p-2 px-4 text-lg"><div class="flex w-full flex-col items-center text-xs"><span class="mb-2">V2</span><input type="text" disabled class="w-1/2 rounded-lg border border-white bg-zinc-700 px-3 py-2 text-left" value="---"></div></div>
        <div class="flex w-full items-center justify-between bg-zinc-700 p-2 px-4 text-lg"><div class="flex w-full flex-col items-center text-xs"><span class="mb-2">Flex Temperature</span><div class="flex w-1/2"><input type="text" placeholder="---" disabled class="w-full rounded-l-lg border border-white bg-zinc-700 px-3 py-2 text-left" value="---"><div class="flex items-center rounded-r-lg border border-white bg-zinc-600 px-2">°C</div></div></div></div>
        <div class="flex w-full items-center justify-between rounded-br-lg bg-zinc-600 p-2 px-4 text-lg"><div class="flex w-full flex-col items-center text-xs"><span class="mb-2">Flaps</span><input type="text" placeholder="---" disabled class="w-1/2 rounded-lg border border-white bg-zinc-700 px-3 py-2 text-left" value="---"></div></div>
      </div>
    </div>
  </div>
</div>
